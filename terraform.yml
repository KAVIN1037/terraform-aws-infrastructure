name: Terraform AWS Infrastructure CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Format, Validate and Plan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan -input=false -out=tfplan \
            -var="environment=dev" \
            -var="aws_region=us-east-1" \
            -var="instance_type=t3.micro" \
            -var="vpc_id=vpc-0e637995636352d06" \
            -var="subnet_id=subnet-0801099328dae143c" \
            -var="ami_id=ami-0c02fb55956c7d316" \
            -var="web_security_group_id=sg-0ec27654a9b8f9af7" \
            -var="iam_instance_profile=dev-ec2-instance-profile"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan
          retention-days: 1

  terraform-apply:
    name: Approval and Apply
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: .

      - name: Terraform Apply
        run: terraform apply -input=false tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Outputs
        run: terraform output

      - name: Infrastructure Validation
        run: |
         set -e
          INSTANCE_ID="$(terraform output -raw instance_id)"
          ELASTIC_IP="$(terraform output -raw elastic_ip)"
          test -n "$INSTANCE_ID"
          test -n "$ELASTIC_IP"
          echo "Instance ID: $INSTANCE_ID"
          echo "Elastic IP: $ELASTIC_IP"
          echo "Application URL: http://$ELASTIC_IP"
          echo "Infrastructure validation passed."
